# Model recipes. Each entry is one model with one sensible training recipe; `seeds` repeats it so the
# comparison is between models (mean ± spread over seeds), not between single runs.
# Keys map to med_notes.config.ExperimentConfig.
#
# The `experiments` job parameter selects runs:
#   group:main          the models in the final comparison, 3 seeds each
#   group:large         the large-model round (PEGASUS-large, BioBART-large)
#   group:archive       recipes kept for the record, not in the comparison (BART-large-CNN)
#   group:pilot         one BioBART run, to measure real cost and timing before the full job
#   biobart             every seed of one model
#   biobart_s42         one run

defaults:
  seeds: [13, 42, 2026]
  groups: [main]
  include_section_header: true   # the section to write is known at inference time, so tell the model
  max_epochs: 10
  early_stopping_patience: 2     # stop after 2 epochs without val-loss improvement, keep the best epoch
  batch_size: 8
  grad_accum: 2                  # effective batch 16
  warmup_ratio: 0.1
  weight_decay: 0.01
  label_smoothing: 0.1
  save_model: true               # best seed per model goes to the models volume (for the Space)

experiments:
  # Domain-pretrained BART (PubMed). Small and fast: the main candidate for a CPU-hosted Space.
  - name: biobart
    model_name: GanjinZero/biobart-v2-base
    learning_rate: 5.0e-5
    est_minutes: 8

  # Large models (second round). PEGASUS-large is the pretrained-only checkpoint (gap-sentence
  # generation on C4 + news), not one fine-tuned to a single summarization task. It has no <s> start token,
  # and its SentencePiece vocabulary has no newline (it writes the template on one line, like T5).
  - name: pegasus_large
    model_name: google/pegasus-large
    learning_rate: 5.0e-5
    groups: [main, large]
    est_minutes: 12

  # The large version of the biomedical BART: does the domain model improve with size?
  - name: biobart_large
    model_name: GanjinZero/biobart-v2-large
    learning_rate: 3.0e-5
    groups: [main, large]
    est_minutes: 9

  # ARCHIVED: BART fine-tuned on CNN/DailyMail. Too specialized to news-highlight summarization for this
  # task: worst model in the first 3x3 run, and some seeds collapse into repeating the start token
  # (<s><s><s>..., 47% "empty" notes). Kept for the record; not part of the main comparison.
  - name: bart_large_cnn
    model_name: facebook/bart-large-cnn
    learning_rate: 3.0e-5
    groups: [archive]
    est_minutes: 18

  # T5 fine-tunes at a much higher LR than BART-family models; 3e-5 badly undertrains it.
  - name: t5_base
    model_name: google-t5/t5-base
    input_prefix: "summarize: "
    learning_rate: 3.0e-4
    est_minutes: 10

  # Follow-up to the first 3x3 run, where 47% of bart_large_cnn notes were empty. Hypothesis: the main
  # recipe's min_length=0 lets the model stop immediately; min_length=10 blocks that without forcing content.
  # Result: REJECTED. Empty notes barely moved (36/76/30% -> 34/57/23% by seed). Inspecting the saved
  # weights showed why: the "empty" notes are 256 repeated start tokens (<s><s><s>...), which decode to "".
  # The model never emits an end token, so min_length can't help. Some seeds collapse during training.
  - name: bart_large_cnn_minlen
    model_name: facebook/bart-large-cnn
    learning_rate: 3.0e-5
    generation: {min_length: 10}
    groups: [archive, bart_followup]
    est_minutes: 6

  # One BioBART run, for checking real cost and timing before the full job.
  - name: pilot_biobart
    model_name: GanjinZero/biobart-v2-base
    learning_rate: 5.0e-5
    seeds: [42]
    groups: [pilot]
    save_model: false
    est_minutes: 8
