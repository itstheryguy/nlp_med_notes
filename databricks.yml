# Databricks Asset Bundle: the training + audit pipeline as code.
#
#   databricks bundle validate
#   databricks bundle deploy -t dev        # creates/updates the job; starts no compute
#   databricks bundle run -t dev pipeline  # default params = the PILOT (1 BioBART run, 10 judge examples)
#   databricks bundle run -t dev pipeline --params experiments=group:main,max_train_minutes=150,judge_sample_size=40
#
# Compute: every Databricks task runs on serverless jobs compute. Training runs on an AWS SageMaker GPU
# (this account can't start Serverless GPU: "AI Runtime is not available"), set up by the aws-ml-infra
# stack. Training is capped three ways: the in-job budget guard (max_train_minutes), the SageMaker
# MaxRuntimeInSeconds, and the IAM policy (allowed instance types, 4 h max). To train on Databricks
# compute instead, point train_evaluate at 02_train_evaluate.py and set run_volume=pipeline.

bundle:
  name: nlp_med_notes

sync:
  exclude:
    - "nlp final project/**"
    - "tests/**"

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace
  schema:
    description: Schema for tables and volumes
    default: med_notes
  train_timeout_seconds:
    description: Hard cap on the training task, a backstop for the budget guard. 5 h (SageMaker's own cap is 4 h).
    default: 18000
  aws_region:
    default: us-east-2
  aws_service_credential:
    description: Unity Catalog service credential for SageMaker API calls (aws-ml-infra)
    default: aws-ml-training
  sagemaker_bucket:
    description: aws-ml-infra stack output BucketName
    default: ml-training-<aws-account-id>-us-east-2
  sagemaker_role_arn:
    description: aws-ml-infra stack output SageMakerExecutionRoleArn
    default: arn:aws:iam::<aws-account-id>:role/sagemaker-ml-training-execution
  sagemaker_instance_type:
    default: ml.g5.xlarge

resources:
  experiments:
    med_notes:
      name: /Workspace/Users/${workspace.current_user.userName}/nlp_med_notes_${bundle.target}

  jobs:
    pipeline:
      name: med_notes_pipeline
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        # group:main (3 models x 3 seeds), group:pilot, a model name, or run names; see configs/experiments.yml
        - name: experiments
          default: group:pilot
        - name: eval_splits
          default: val,test
        # The budget guard skips any run that would push the GPU session past this.
        - name: max_train_minutes
          default: "90"
        - name: judge_endpoint
          default: databricks-gpt-oss-120b
        - name: judge_sample_size
          default: "10"
        - name: judge_max_calls
          default: "600"
        # Hourly rate for the report's quick cost estimate; 0 skips it (billed cost is shown regardless).
        - name: train_usd_per_hour
          default: "0"
        - name: refresh_data
          default: "false"
        # Where run folders live: sagemaker (S3-backed external volume) or pipeline (Databricks-managed).
        - name: run_volume
          default: sagemaker
        - name: aws_region
          default: ${var.aws_region}
        - name: aws_service_credential
          default: ${var.aws_service_credential}
        # The S3 prefix behind the sagemaker volume, one per bundle target.
        - name: sagemaker_s3_root
          default: s3://${var.sagemaker_bucket}/nlp_med_notes/${var.schema}
        - name: sagemaker_role_arn
          default: ${var.sagemaker_role_arn}
        - name: sagemaker_instance_type
          default: ${var.sagemaker_instance_type}
        - name: sagemaker_use_spot
          default: "true"
        - name: sagemaker_usd_per_hour
          default: "1.2575"
        - name: mlflow_experiment
          default: ${resources.experiments.med_notes.name}
        - name: job_run_id
          default: "{{job.run_id}}"
        - name: job_id
          default: "{{job.id}}"
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py

        - task_key: prepare_data
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/01_prepare_data.py

        - task_key: train_evaluate
          depends_on:
            - task_key: prepare_data
          # Serverless CPU task that starts the SageMaker job and waits for it. To train on Databricks
          # instead: notebook 02_train_evaluate.py, run_volume=pipeline, and for Serverless GPU add
          #   environment_key: gpu / compute: {hardware_accelerator: GPU_1xA10}
          # plus a job-level environments entry with base_environment: databricks_ai_v6.
          timeout_seconds: ${var.train_timeout_seconds}
          max_retries: 0  # a retry would start a second training job
          notebook_task:
            notebook_path: ./notebooks/02_train_sagemaker.py

        - task_key: ingest_results
          depends_on:
            - task_key: train_evaluate
          run_if: ALL_DONE  # keep whatever finished, even if the GPU task failed or timed out
          notebook_task:
            notebook_path: ./notebooks/03_ingest_results.py

        - task_key: judge_audit
          depends_on:
            - task_key: ingest_results
          notebook_task:
            notebook_path: ./notebooks/04_judge_audit.py

        - task_key: report
          depends_on:
            - task_key: judge_audit
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ./notebooks/05_report.py

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: med_notes_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
